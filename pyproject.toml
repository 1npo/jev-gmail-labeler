[project]
name = "jev-gmail-labeler"
dynamic = ["version"]
description = "Label Gmail messages in real time with Jev"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "en-core-web-md @ https://github.com/explosion/spacy-models/releases/download/en_core_web_md-3.8.0/en_core_web_md-3.8.0-py3-none-any.whl",
    "google-api-python-client>=2.200.0",
    "google-auth>=2.58.0",
    "google-auth-oauthlib>=1.4.1",
    "google-cloud-pubsub>=2.42.0",
    "lxml>=6.1.3",
    "platformdirs>=4.12.3",
    "presidio-analyzer>=2.2.364",
    "presidio-anonymizer>=2.2.364",
    "spacy>=3.8.16",
    "typesafe-sdk>=0.7.2",
]

[project.scripts]
jev-gmail-labeler = "jev_gmail_labeler.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/jev_gmail_labeler/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/jev_gmail_labeler"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.ruff]
line-length = 90 # For linting (e.g., E501 rule)
src = ["src", "tests"]
extend-exclude = ["sandbox"]  # legacy prototype, removed in a later session
include = ["*.py", "*.pyi", "**/pyproject.toml"]  # skip Markdown, which ruff can also format

[tool.ruff.lint]
select = [
    "E",   # pycodestyle
    "F",   # Pyflakes
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
    "I",   # isort
]

[tool.ruff.format]
quote-style = "single"
indent-style = "space"
docstring-code-format = true
docstring-code-line-length = 70

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib --disable-socket --cov=jev_gmail_labeler --cov-report=term-missing"

[tool.coverage.run]
source = ["jev_gmail_labeler"]
branch = true

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_covered = true
exclude_also = ["if TYPE_CHECKING:", "raise NotImplementedError", "if __name__ == .__main__.:"]

[tool.uv]
package = true


[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "pytest-socket>=0.8.1",
    "ruff>=0.16.10",
]
